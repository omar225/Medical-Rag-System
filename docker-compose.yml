# One command: docker compose up --build   (UI + API on http://localhost:8000)
# GPU (NVIDIA): docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.15}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Downloads the two open-weights models once into the shared volume, then exits.
  models:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.15}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-qwen3.5:4b} && ollama pull ${EMBEDDING_MODEL:-bge-m3}"]
    restart: "no"

  app:
    build: .
    depends_on:
      models:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      # The dense index is built from the approved KB on first start and reused afterwards.
      - vector-index:/app/storage/vector_store
    restart: unless-stopped

volumes:
  ollama-models:
  vector-index:
